<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #173b67;
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #dbeafe;
        }

        .container {
            max-width: 1050px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .card {
            background: white;
            padding: 24px;
            margin-bottom: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn {
            background: #16794b;
            margin-top: 15px;
        }

        .delete-btn {
            background: #dc2626;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #eaf0f8;
            white-space: nowrap;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        td form {
            margin: 0;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 25px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Library Management System</h1>
    <p>Manage your books in one place</p>
</header>

<main class="container">

    <!-- Add Book Form -->
    <section class="card">
        <h2>➕ Add New Book</h2>

        <form th:action="@{/add}" th:object="${book}" method="post">
            <div class="form-grid">
                <input
                    type="text"
                    th:field="*{title}"
                    placeholder="Book Title"
                    required>

                <input
                    type="text"
                    th:field="*{author}"
                    placeholder="Author Name"
                    required>

                <input
                    type="text"
                    th:field="*{category}"
                    placeholder="Category"
                    required>
            </div>

            <button type="submit" class="add-btn">
                Add Book
            </button>
        </form>
    </section>

    <!-- Available Books Table -->
    <section class="card">
        <h2>📖 Available Books</h2>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>
                    <!-- Each book appears in its own row -->
                    <tr th:each="item : ${books}">
                        <td th:text="${item.id}"></td>
                        <td th:text="${item.title}"></td>
                        <td th:text="${item.author}"></td>
                        <td th:text="${item.category}"></td>

                        <td>
                            <form
                                th:action="@{/delete/{id}(id=${item.id})}"
                                method="post">

                                <button type="submit" class="delete-btn">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>

                    <!-- Message when no books exist -->
                    <tr th:if="${#lists.isEmpty(books)}">
                        <td colspan="5" class="empty">
                            No books available. Add your first book!
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer>
    Library Management System | Spring Boot + Maven + Jenkins
</footer>

</body>
</html>
